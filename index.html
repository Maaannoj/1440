<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>1440</title>
  <meta name="description" content="A personal daily habit tracker. Every minute counts.">
  <meta name="theme-color" content="#EEF1ED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1A22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="1440">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="main" class="screen" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" aria-label="Sections" hidden></nav>
  <div id="sheet-root" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <label id="haptic" class="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
  <noscript><p class="noscript">1440 needs JavaScript turned on.</p></noscript>
  <script src="./config.js"></script>
  <script src="./vendor/supabase.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
